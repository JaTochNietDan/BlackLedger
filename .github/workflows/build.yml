name: Test and distribute
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Validate release workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/build.yml
      - run: go vet ./...
      - run: go test -race -timeout 50m ./...
      - run: npm test
      - run: npm test --prefix desktop
      - run: npm run build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: windows
            arch: amd64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      - name: Choose archive version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "RELEASE_VERSION=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi
      - name: Package game and notices
        shell: bash
        run: python scripts/package-release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} --version "$RELEASE_VERSION"
      - name: Smoke test native archive
        shell: bash
        run: |
          for archive in release/*.zip release/*.tar.gz; do
            [ -f "$archive" ] || continue
            if [ "${{ runner.os }}" = Linux ]; then
              xvfb-run -a python scripts/smoke-release.py "$archive" --with-ai-voice
            else
              python scripts/smoke-release.py "$archive" --with-ai-voice
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: black-ledger-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: black-ledger-*
          path: release
          merge-multiple: true
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "Black Ledger $RELEASE_TAG" --generate-notes
