# Tooling for Black Ledger. Everything this repository needs to build and run is
# pinned here and managed by mise; nothing is expected from Homebrew or from a
# globally installed runtime.
#
#   mise install     # get the toolchain
#   mise run build   # the whole build, the way CI would do it
#   mise run verify  # what has to pass before anything is committed

[tools]
go = "1.23.1"
node = "20.17.0"
python = "3.12"

[env]
# The art tools install into a project-local virtualenv rather than the user's
# global site-packages. Nothing at runtime depends on it: portraits are
# generated offline and the game ships the PNGs.
VIRTUAL_ENV = "{{config_root}}/.venv"
_.path = ["{{config_root}}/.venv/bin"]

[tasks.build]
description = "Build the server binary and the production frontend"
run = ["go build -o .runtime/blackledger ./cmd/blackledger", "npm run build"]

[tasks.verify]
description = "Everything that has to pass before a commit"
run = [
  "gofmt -l core cmd store sim",
  "go vet ./...",
  "go test ./... -count=1",
  "npx tsc --noEmit",
  "npm run build",
]

[tasks.race]
description = "The full race-detector run"
run = "go test -race ./core/ ./store/ ./sim/ ./cmd/blackledger/ -count=1"

[tasks.simulate]
description = "Headless campaigns at scale"
run = "go run ./cmd/simulate"

[tasks.workshop]
description = "The playtest workshop, on its own port, against a scratch world"
run = ["npm run build", "go run ./cmd/playtest"]

[tasks.fit-art]
description = "Measure where each cut-out's building stands in its own frame"
run = [".venv/bin/python tools/fitiso.py public/art/iso .runtime/iso-fit --proof"]

[tasks.city-art]
description = "Render the isometric buildings with Blender, headless"
run = [
  ".venv-blender/bin/python tools/blendercity.py public/art/iso",
]

# bpy needs Python 3.13 and the rest of the project is pinned to 3.12, so the
# modelled art gets its own virtualenv. There is no Blender application to
# install: the renderer is a wheel from PyPI.
[tasks.city-art-setup]
description = "Set up the headless Blender renderer in its own virtualenv"
run = [
  "mise x python@3.13 -- python -m venv .venv-blender",
  ".venv-blender/bin/pip install --quiet --upgrade pip",
  ".venv-blender/bin/pip install --quiet bpy",
]

[tasks.art]
description = "Set up the offline image toolchain in a project-local venv"
run = [
  "python -m venv .venv",
  ".venv/bin/pip install --quiet --upgrade pip",
  ".venv/bin/pip install --quiet mflux pillow",
]
# FLUX.1-schnell upstream is gated behind an account acceptance, so the weights
# come from the ungated mflux-community 8-bit quantisation instead. About 17GB,
# pulled once into the Hugging Face cache.

[tasks.portraits]
description = "Regenerate the cast's faces (needs `mise run art` first)"
run = ".venv/bin/python tools/portraits.py public/art 24"

[tasks.scenes]
description = "Paint the moments the theatre plays (needs `mise run art` first)"
run = ".venv/bin/python tools/scenes.py public/art/scenes"

[tasks.exteriors]
description = "Paint the buildings that have no exterior (needs `mise run art` first)"
run = ".venv/bin/python tools/exteriors.py public/art/fronts"

[tasks.isometric]
description = "Paint every address as an isometric cut-out for the city view (needs `mise run art`)"
run = ".venv/bin/python -c \"import sys;sys.path.insert(0,'tools');import isometric;isometric.paint('public/art/iso',sys.argv[1:])\""

[tasks.interiors]
description = "Regenerate the inside of every building (needs `mise run art` first)"
run = ".venv/bin/python tools/interiors.py public/art/rooms"
