<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Ledger · Painted noir study</title><style>
:root{color-scheme:dark;font-family:system-ui;color:#e7dfce;background:#111a1c}*{box-sizing:border-box}body{margin:0}header{padding:20px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #53605d;gap:24px}h1{font:26px Georgia;margin:5px 0}small{color:#b9b7a5;letter-spacing:.12em}a{color:#dfbb79}.scene{position:relative;max-width:1200px;margin:auto;aspect-ratio:3/2;overflow:hidden;background:radial-gradient(ellipse at 52% 58%,#6f7160,#313e3a 60%,#1b292b);--night:0}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(30deg,transparent 0 67px,#e4dcc50a 68px 69px),repeating-linear-gradient(150deg,transparent 0 67px,#e4dcc50a 68px 69px)}.building{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:brightness(calc(1 - var(--night)*.56)) saturate(calc(1 - var(--night)*.15));pointer-events:none}.lights{position:absolute;inset:0;width:100%;height:100%;opacity:var(--night);pointer-events:none}.bulb{fill:#ffdf8e;filter:drop-shadow(0 0 4px #ffb750);animation:chase 1.2s infinite steps(2);animation-delay:calc(var(--i)*-.12s)}@keyframes chase{50%{opacity:.24}}.still .bulb{animation:none}footer{max-width:1000px;margin:0 auto;padding:15px 24px 30px;display:flex;flex-wrap:wrap;align-items:center;gap:22px}label{display:flex;align-items:center;gap:10px}input[type=range]{width:210px;accent-color:#d9b87b}p{font-size:13px;color:#b4bcae;flex-basis:100%;margin:0}button{background:#27362f;border:1px solid #78826d;color:#f0dfb8;padding:8px 14px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f2ce86;outline-offset:4px}@media(prefers-reduced-motion:reduce){.bulb{animation:none}}@media(max-width:600px){header{padding:16px;flex-wrap:wrap}h1{font-size:22px}.scene{min-height:360px}.building,.lights{object-fit:contain}footer{gap:14px}}
</style></head><body><header><div><small>BLACK LEDGER / ART DIRECTION</small><h1>Painted noir. Separate light.</h1></div><a href="/street-study.html">Explore the animated street →</a></header><main><div class="scene" id="scene"><img class="building" src="/art/casino-noir-v1.png" alt="Painted brick and limestone art deco casino, viewed isometrically"><svg class="lights" viewBox="0 0 1536 1024" aria-hidden="true"><defs><radialGradient id="glow"><stop stop-color="#efba64" stop-opacity=".35"/><stop offset="1" stop-color="#efba64" stop-opacity="0"/></radialGradient></defs><ellipse cx="1004" cy="899" rx="220" ry="92" fill="url(#glow)"/><g id="bulbs"></g></svg></div><footer><label for="light">Day<input id="light" type="range" min="0" max="100" value="0">Night</label><label><input id="animate" type="checkbox" checked>Marquee animation</label><button id="night">Show nightlife</button><p>One transparent building image, with procedural light and marquee overlays. This study previews the asset approach; lighting masks, street tiles and production map placement come next.</p></footer></main><script>
const scene=document.querySelector('#scene'),slider=document.querySelector('#light');function update(){scene.style.setProperty('--night',slider.value/100)}slider.addEventListener('input',update);document.querySelector('#night').onclick=()=>{slider.value=slider.value>50?0:100;update()};document.querySelector('#animate').onchange=e=>scene.classList.toggle('still',!e.target.checked);
// Bulbs follow the lower edge of the painted marquee, in source-image coordinates.
const points=[[794,699],[818,714],[849,727],[880,738],[913,747],[947,754],[982,757],[1017,755],[1051,750],[1084,742],[1115,730],[1144,716],[1168,701],[1188,683]];const group=document.querySelector('#bulbs');points.forEach(([x,y],i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','3');c.setAttribute('class','bulb');c.style.setProperty('--i',i);group.appendChild(c)});update();
</script></body></html>
