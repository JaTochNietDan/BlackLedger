<!doctype html><html><head><meta charset="utf-8"><title>Bellwether car cabin review</title><style>body{margin:0;background:#242822;color:#e8d5b1;font:14px Georgia}nav{position:fixed;top:16px;left:16px;z-index:1;display:flex;gap:10px;align-items:center}button,select{padding:8px;background:#e0ceaa;color:#332819;border:1px solid #89714a}canvas{display:block}</style></head><body><nav><span>Model inspection</span><select aria-label="Car model"><option>ford</option><option>hudson</option><option>packard</option><option>police</option></select><select aria-label="Driver rig" id="rig"><option>person</option><option>woman</option></select><button id="side">Driver side</button><button id="doors">Open doors</button><span id="status"></span></nav><script type="module">
import * as THREE from 'three';
import {seatDriver} from '../src/city3dSeating.ts';
import {dressPedestrian,wardrobe} from '../src/city3dWardrobe.ts';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#343b34');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(5,2.9,6.3);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.85,0);controls.update();scene.add(new THREE.HemisphereLight(0xece7d8,0x444133,2));const sun=new THREE.DirectionalLight(0xfff1da,3);sun.position.set(4,7,5);sun.castShadow=true;sun.shadow.normalBias=.025;sun.shadow.bias=-.0002;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new THREE.DirectionalLight(0xc4d6ee,2);fill.position.set(-5,3,-3);scene.add(fill);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x4a5147,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let model,opened=false,request=0;async function load(name){const id=++request;const [gltf,person]=await Promise.all([new GLTFLoader().loadAsync('/art/models/'+name+'.glb'),new GLTFLoader().loadAsync('/art/models/'+document.querySelector('#rig').value+'.glb')]);if(id!==request){for(const root of [gltf.scene,person.scene])root.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose();}});return;}if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose();}});}model=gltf.scene;model.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});const driver=person.scene;
 dressPedestrian(driver,document.querySelector('#rig').value,wardrobe('leo'));seatDriver(driver,model.getObjectByName('seat-front-left').position,['left','right'].map(side=>model.getObjectByName('seat-driver-grip-'+side).position));model.add(driver);
 model.traverse(o=>{if(o.isMesh&&o.material.name==='car glass'){o.material.transparent=true;o.material.opacity=.38;o.material.depthWrite=false;}});
 scene.add(model);opened=false;document.querySelector('#doors').textContent='Open doors';document.querySelector('#status').textContent=name;}
document.querySelector('#side').onclick=()=>{camera.position.set(-4,1.9,1.4);controls.target.set(-.2,.9,0);controls.update();};
document.querySelector('select').onchange=e=>load(e.target.value);document.querySelector('#rig').onchange=()=>load(document.querySelector('select').value);document.querySelector('#doors').onclick=()=>{opened=!opened;document.querySelector('#doors').textContent=opened?'Close doors':'Open doors';};await load('ford');let before=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-before)/1000);before=now;model?.traverse(o=>{if(o.name.startsWith('car-door-')){const target=opened?(o.name.endsWith('left')?1:-1)*Math.PI/2:0;o.rotation.y+=(target-o.rotation.y)*(1-Math.exp(-dt*8));}});controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
