<!doctype html><html><head><meta charset="utf-8"><title>Villa stair pose review</title><style>body{margin:0;background:#1c211d;color:#e6d7b6;font:18px Georgia}p{position:absolute;top:10px;left:25px}canvas{display:block}</style></head><body><p>Villa stair descent <button id="play">Play descent</button> <button data-step="0">Upper steps</button> <button data-step="1">Lower steps</button> <button data-step="2">Pavement</button><output></output></p><canvas></canvas><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import {CityStairDescent} from '/src/city3dStairs.ts';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x1c211d);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(5,3,-12);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,-6.5);controls.update();
scene.add(new THREE.HemisphereLight(0xffefd5,0x334439,2));const sun=new THREE.DirectionalLight(0xffe8c0,3);sun.position.set(-3,8,-5);scene.add(sun);
const loader=new GLTFLoader(),building=(await loader.loadAsync('/art/models/villa.glb')).scene,actor=(await loader.loadAsync('/art/models/person.glb')).scene;scene.add(building,actor);const stairs=new CityStairDescent(actor);scene.add(stairs.root);stairs.root.position.set(0,.6,-6.23);
const floor=new THREE.Mesh(new THREE.BoxGeometry(20,.1,20),new THREE.MeshStandardMaterial({color:0x5a594a}));floor.position.y=-.055;scene.add(floor);
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);
let request=0;
function pose(seconds){const p=stairs.update(seconds);document.body.dataset.pose=JSON.stringify({seconds,reached:p.reached,feet:p.feet,done:p.done});document.querySelector('output').value=seconds.toFixed(2)+'s';render();}
for(const button of document.querySelectorAll('[data-step]'))button.onclick=()=>{cancelAnimationFrame(request);pose([.65,1.95,3.9][Number(button.dataset.step)]);};
document.getElementById('play').onclick=()=>{cancelAnimationFrame(request);const start=performance.now();const frame=now=>{const t=Math.min(stairs.duration,(now-start)/1000);pose(t);if(t<stairs.duration)request=requestAnimationFrame(frame);};request=requestAnimationFrame(frame);};pose(0);
</script></body></html>
