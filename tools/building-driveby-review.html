<!doctype html><html><head><meta charset="utf-8"><title>Building drive-by motion review</title><style>body{margin:0;background:#242822;color:#e8d5b1;font:16px Georgia}nav{position:fixed;top:16px;left:16px;z-index:1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{padding:8px;background:#e0ceaa;color:#332819;border:1px solid #89714a}input{width:70px}canvas{display:block}</style></head><body><nav><span>Drive-by motion study</span><select aria-label="Car"><option>ford</option><option>hudson</option><option>packard</option></select><select aria-label="Shooter"><option>person</option><option>woman</option></select><select aria-label="Weapon"><option>revolver</option><option>shotgun</option><option>thompson</option></select><button id="play">Play</button><button id="shot">Firing pose</button><button id="side">Passenger side</button><label>Time <input aria-label="Time" id="time" type="number" min="0" max="6.2" step=".01" value="0"></label><output></output></nav><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CityBuildingDriveBy} from '../src/city3dBuildingDriveBy.ts';
import {dressPedestrian,wardrobe} from '../src/city3dWardrobe.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#343b34');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(12,8,15);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.update();scene.add(new THREE.HemisphereLight(0xece7d8,0x444133,2));const sun=new THREE.DirectionalLight(0xfff1da,3);sun.position.set(4,9,5);sun.castShadow=true;sun.shadow.normalBias=.025;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const fill=new THREE.DirectionalLight(0xc4d6ee,2);fill.position.set(-5,3,-3);scene.add(fill);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x4a5147,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader(),models=new Map();for(const name of ['ford','hudson','packard','person','woman','revolver','shotgun','thompson'])models.set(name,(await loader.loadAsync('/art/models/'+name+'.glb')).scene);
const selects=[...document.querySelectorAll('select')];let cast,request=0,costumes=[];
function render(){if(renderer.domElement.clientWidth!==innerWidth||renderer.domElement.clientHeight!==innerHeight){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/Math.max(1,innerHeight);camera.updateProjectionMatrix();}renderer.render(scene,camera);}
function pose(t){cast.update(t);document.querySelector('#time').value=t.toFixed(2);document.querySelector('output').value=t.toFixed(2)+'s';document.body.dataset.pose=JSON.stringify({seconds:t,car:selects[0].value,shooter:selects[1].value,weapon:selects[2].value,x:cast.car.position.x,shooterPosition:cast.shooter.getWorldPosition(new THREE.Vector3()),driverPosition:cast.driver.getWorldPosition(new THREE.Vector3())});render();}
function load(){cancelAnimationFrame(request);if(cast){scene.remove(cast.root);cast.dispose();costumes.forEach(m=>m.dispose());}const car=models.get(selects[0].value).clone(true),driver=models.get('person').clone(true),shooter=models.get(selects[1].value).clone(true),weapon=models.get(selects[2].value).clone(true);costumes=[...dressPedestrian(driver,'person',wardrobe('leo')),...dressPedestrian(shooter,selects[1].value,wardrobe('player'))];cast=new CityBuildingDriveBy(car,driver,shooter,weapon,selects[2].value);cast.root.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(cast.root);pose(2.4);}
selects.forEach(s=>s.onchange=load);document.querySelector('#time').oninput=e=>{cancelAnimationFrame(request);pose(Number(e.target.value));};document.querySelector('#shot').onclick=()=>{cancelAnimationFrame(request);pose(2.4);};document.querySelector('#side').onclick=()=>{const x=cast.car.position.x;camera.position.set(x+2.5,2.2,5);controls.target.set(x,.95,0);controls.update();render();};document.querySelector('#play').onclick=()=>{cancelAnimationFrame(request);camera.position.set(12,8,15);controls.target.set(0,.8,0);controls.update();const start=performance.now();function frame(now){const t=Math.min(6.2,(now-start)/1000);pose(t);if(t<6.2)request=requestAnimationFrame(frame);}request=requestAnimationFrame(frame);};controls.addEventListener('change',render);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();});load();
</script></body></html>
